kind: pipeline
name: galactae-website

steps:
- name: sonarqube
  image: aosapps/drone-sonar-plugin
  settings:
    sonar_host: 
      from_secret: SONAR_HOST
    sonar_token: 
      from_secret: SONAR_TOKEN
  when:
    branch:
    - master

- name: docker
  image: plugins/docker
  volumes:
  - name: docker_sock
    path: /var/run/docker.sock
  settings:
    repo: dysnomia/galactae-website
    dockerfile: Dockerfile
    tags: ${DRONE_BRANCH}
    dry_run: true
    pull-image: false
  environment:
    PLUGIN_PULL_IMAGE: false

  when:
    event:
    - push

- name: discord
  pull: default
  image: appleboy/drone-discord
  settings:
    webhook_id:
      from_secret: WEBHOOK_ID
    webhook_token:
      from_secret: WEBHOOK_TOKEN
    message: >
      {{#success build.status}}
        Build **{{repo.name}}** on branch **{{build.branch}}** ({{truncate build.commit 8}}) succeeded.
      {{else}}
        Build **{{repo.name}}** on branch **{{build.branch}}** ({{truncate build.commit 8}}) failed.
      {{/success}}
  when:
    branch:
    - master
    event:
    - push
    status: 
    - changed
    - failure
    - success

volumes:
  - name: docker_sock
    host:
      path: /var/run/docker.sock