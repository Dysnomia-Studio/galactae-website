name: Build & Test

on: [push, pull_request]

permissions:
  packages: write
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    - name: SonarQube Quality Gate check
      uses: sonarsource/sonarqube-quality-gate-action@master
      # Force to fail step after specific time
      timeout-minutes: 5
      env:
       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_tag:
    if: startsWith(github.event.ref, 'refs/tags/')
    needs: sonar
  
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v3.2.0
        with:
          push: true
          tags: ghcr.io/dysnomia-studio/galactae-website:${{github.ref_name}}
          build-args: |
            NPM_TOKEN=${{secrets.GITHUB_TOKEN}}  
  
  build_branch:
    if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature/')) && github.event_name == 'push' }}
    needs: sonar
  
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v3.2.0
        with:
          push: true
          tags: ghcr.io/dysnomia-studio/galactae-website:${{ github.head_ref || github.ref_name }} 
          build-args: |
            NPM_TOKEN=${{secrets.GITHUB_TOKEN}}  
